name: Base Fork V2 Causal Sweep

on:
  push:
    branches: ["print_money_synergychain"]
    paths:
      - "analysis/base_fork_v2_optimizer.py"
      - "test/BaseForkV2.t.sol"
      - "contracts/**"
      - "docs/BASE_FORK_V2.md"
      - ".github/workflows/base-fork-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_RPC_URL: https://mainnet.base.org
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Real Base fork smoke tests
        run: forge test --fork-url "$BASE_RPC_URL" --match-contract BaseForkV2Test -vvv

  causal-grid:
    runs-on: ubuntu-latest
    env:
      BASE_RPC_URL: https://mainnet.base.org
      V2_PRINCIPAL_USDC: "10000"
      V2_LOOKBACK_HOURS: "72"
      V2_ANCHORS: "2"
      V2_OUT_DIR: results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optimizer dependency
        run: pip install "web3>=7,<8"
      - name: Run archive-state causal grid
        run: python analysis/base_fork_v2_optimizer.py
      - name: Upload Base-fork V2 results
        uses: actions/upload-artifact@v4
        with:
          name: BASE_FORK_V2_RESULTS
          path: |
            results/base_fork_v2_grid.csv
            results/base_fork_v2_summary.json
            results/BASE_FORK_V2_REPORT.md
          if-no-files-found: error
