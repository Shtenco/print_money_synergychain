name: AICB EVM Tests

on:
  push:
    branches:
      - aicb-v1-exact-reset
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Forge version
        run: forge --version
      - name: Build
        run: forge build --sizes
      - name: EVM tests
        run: forge test -vvv
