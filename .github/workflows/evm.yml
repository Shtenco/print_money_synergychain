name: AICB EVM Tests

on:
  push:
    branches:
      - aicb-v1-exact-reset
      - aicb-v2-mainnet-fork
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
      BASE_RPC_URL: https://base-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Forge version
        run: forge --version
      - name: Build
        run: |
          set -o pipefail
          forge build --sizes 2>&1 | tee build-results.txt
      - name: Baseline EVM tests
        run: |
          set -o pipefail
          forge test -vvv --match-path test/AICBSystem.t.sol 2>&1 | tee baseline-results.txt
      - name: Mainnet latest fork tests
        if: github.ref_name == 'aicb-v2-mainnet-fork'
        run: |
          set -o pipefail
          forge test -vvv --match-path test/MainnetForkLatest.t.sol 2>&1 | tee fork-results.txt
      - name: 10k stochastic economic firewall
        if: github.ref_name == 'aicb-v2-mainnet-fork'
        run: |
          set -o pipefail
          forge test -vvv --match-path test/StochasticEconomicFirewall.t.sol 2>&1 | tee stochastic-results.txt
      - name: V2.2 P5 distribution firewall
        if: github.ref_name == 'aicb-v2-mainnet-fork'
        run: |
          set -o pipefail
          forge test -vvv --match-path test/DistributionFirewallV22.t.sol 2>&1 | tee v22-results.txt
      - name: Upload EVM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evm-results-${{ github.run_number }}
          path: |
            build-results.txt
            baseline-results.txt
            fork-results.txt
            stochastic-results.txt
            v22-results.txt
