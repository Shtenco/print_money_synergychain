name: AICB EVM Tests

on:
  push:
    branches:
      - aicb-v1-exact-reset
      - aicb-v2-mainnet-fork
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Forge version
        run: forge --version
      - name: Build
        run: forge build --sizes
      - name: EVM tests
        run: |
          set -o pipefail
          forge test -vvv 2>&1 | tee evm-results.txt
      - name: Upload EVM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evm-results-${{ github.run_number }}
          path: evm-results.txt
