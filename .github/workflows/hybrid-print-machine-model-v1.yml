name: Hybrid Print-Machine Model v1

on:
  pull_request:
    paths:
      - 'model/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/hybrid-print-machine-model-v1.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run model tests
        run: pytest -q tests/test_hybrid_print_machine.py
      - name: Compile model
        run: python -m py_compile model/hybrid_print_machine.py
